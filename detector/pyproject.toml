[project]
name = "blackbox-detector"
version = "0.1.0"
description = "Black Box backend detector: FastAPI + SQLite + SSE"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
]

[project.optional-dependencies]
# Semantic verification. `laya` pulls torch + transformers; kept optional so the
# detector can run in degraded (unavailable) mode without model dependencies.
laya = [
    "laya>=0.4.14",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.uv]
package = false
